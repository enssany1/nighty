name: nighty

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nighty}
      POSTGRES_USER: ${POSTGRES_USER:-nighty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nighty_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nighty} -d ${POSTGRES_DB:-nighty}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nighty-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nighty}:${POSTGRES_PASSWORD:-nighty_dev}@postgres:5432/${POSTGRES_DB:-nighty}?schema=public
      ATTACHMENTS_PATH: /data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nighty-attachments:/data/attachments
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  nighty-postgres:
  nighty-attachments:
