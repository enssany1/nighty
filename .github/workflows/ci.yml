name: Nighty CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nighty
          POSTGRES_USER: nighty
          POSTGRES_PASSWORD: nighty_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nighty -d nighty"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nighty:nighty_ci@127.0.0.1:5432/nighty?schema=public
      POSTGRES_PASSWORD: nighty_ci
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: CI-only-Nighty-password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @nighty/api
      - run: npm run prisma:migrate:deploy -w @nighty/api
      - run: npm run api:generate
      - run: git diff --exit-code
      - run: npm run check
      - run: npm run test:integration -w @nighty/api
      - run: npm run build --workspaces --if-present
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose -f compose.yaml -f compose.production.yaml config
      - run: docker compose -f compose.yaml -f compose.production.yaml build api web
